name: Build Versioned Jar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 0.0.2'
        required: false
        default: '0.0.1-SNAPSHOT'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build executable jar
        run: mvn -B -DskipTests -Drevision=${{ steps.version.outputs.version }} package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceMaker-${{ steps.version.outputs.version }}
          path: target/IceMaker-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30